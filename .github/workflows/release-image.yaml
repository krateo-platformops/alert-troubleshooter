# Build and publish the controller image on a bare-semver tag, owner-derived so a future
# transfer cannot strand it (this repo just moved agentiko -> platformops and its image had
# been pinned at ghcr.io/krateo-agentiko/... with a v-prefixed tag).
name: release-image
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/alert-troubleshooter
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV";
          else echo "VERSION=0.0.0-dev" >> "$GITHUB_ENV"; fi
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          provenance: false
      - name: Verify it runs and answers /healthz
        run: |
          set -euo pipefail
          docker run -d --name at -p 8080:8080 "${IMAGE}:${VERSION}"
          for i in $(seq 1 20); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/healthz || true)" = "200" ] && { echo ok; docker rm -f at; exit 0; }
            sleep 2
          done
          echo "::error::image did not answer /healthz"; docker logs at; docker rm -f at; exit 1
