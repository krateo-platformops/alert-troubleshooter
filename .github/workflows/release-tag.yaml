# Krateo COMPONENT release — alert-troubleshooter, IMAGE build.
#
# Adopts the SHARED org reusable (krateo-platformops/.github component-image-build.yaml@main),
# identical to frontend/portal — one source of truth, no per-repo drift. This replaces the former
# self-contained release-image.yaml, whose `docker/build-push-action` build was single-arch amd64
# with `provenance: false` and no SBOM (it could not schedule on arm64 nodes). The reusable builds
# a multi-arch manifest (default linux/amd64,linux/arm64) with provenance + SBOM.
#
# The Dockerfile is at the repo ROOT, so context ".". The module name "alert-troubleshooter" derives
# the image ghcr.io/<owner>/alert-troubleshooter:<tag> — the same name the chart references. No build
# args: the Dockerfile declares no ARGs and the image tag is the git tag, applied by the reusable.
#
# NOTE: the old release-image.yaml also ran a post-build /healthz smoke (`docker run` the amd64 image
# and curl :8080/healthz). That bespoke step is dropped to stay drift-free with frontend/portal; the
# reusable build + the security workflow are the gates, and a broken image surfaces on the first
# composition reconcile. Re-add a smoke job here if a hard pre-publish health gate is wanted.
name: release-tag

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

jobs:
  build:
    uses: krateo-platformops/.github/.github/workflows/component-image-build.yaml@main
    permissions:
      contents: read
      packages: write
    with:
      modules: '[{"mod":"alert-troubleshooter","context":"."}]'
