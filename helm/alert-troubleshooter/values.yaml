# The controller image. tag defaults to the chart appVersion (= release tag), so chart and
# image move together; override to pin.
image:
  repository: ghcr.io/krateo-platformops/alert-troubleshooter
  tag: ""

config:
  # A2A endpoint of the agent the webhook calls for root-cause analysis. Default = incident-agent
  # (has the k8s/Helm/ClickHouse read tools an RCA needs; autopilot has neither). In-cluster kagent
  # A2A Service, named after the Agent's metadata.name -> incident-agent.<namespace>.svc:8080.
  autopilotA2aUrl: http://incident-agent.krateo-system.svc:8080/
  # HyperDX v2 external API the reconciler pushes Alert CRs to (Bearer auth via hyperdx-api-token).
  # Default = the krateo-clickstack-api Service the observability stack exposes.
  hyperdxApiUrl: http://krateo-clickstack-api.krateo-system.svc:8000
  # Dedup window (seconds): don't re-analyze the same alert within this.
  reportCooldown: 1800
  # How often (seconds) the reconciler pushes Alert CRs to HyperDX.
  reconcileInterval: 60
  # Default Alert CRs the reconciler seeds into HyperDX (rendered to DEFAULT_ALERTS_JSON). Set to []
  # to seed none. Each firing auto-launches a full incident-agent RCA, so this default set is kept
  # DELIBERATELY SMALL, PLATFORM-SCOPED and HIGH-THRESHOLD — the goal is a few high-signal alerts that
  # never storm, not broad coverage (add your own via Alert CRs; see examples/alerts/).
  #
  # `where` is ClickHouse SQL over otel_logs (the reconciler pins whereLanguage=sql; DO NOT use Lucene
  # or SeverityText — this pipeline leaves SeverityText empty). Every `where` is either scoped to the
  # platform namespace (`${NAMESPACE}` is substituted with the release namespace at render time) or
  # excludes the observability stack's own ServiceNames, so an alert never diagnoses the telemetry
  # pipeline itself. Thresholds are >0 over 15m so transient/rollout blips don't page.
  defaultAlerts:
  # The flagship platform-health signal: Krateo control-plane compositions failing to reconcile
  # (controller-runtime's "Reconciler error" log + the provider's CannotObserveExternalResource event),
  # cluster-wide but excluding every service that carries or evaluates telemetry (else it matches
  # HyperDX's own echo of this query and diagnoses itself).
  - name: krateo-composition-reconcile-error
    displayName: "Krateo — composition reconcile errors"
    where: >-
      (positionCaseInsensitive(Body, 'Reconciler error') > 0
       OR JSONExtractString(Body, 'object', 'reason') = 'CannotObserveExternalResource')
      AND ServiceName NOT IN ('krateo-observability', 'krateo-alert-troubleshooter',
          'krateo-clickstack', 'krateo-clickstack-clickhouse-clickhouse', 'clickhouse-mcp-server',
          'incident-agent', 'krateo-autopilot', 'kagent', 'repo-mcp-server')
    interval: 15m
    threshold: 2
    thresholdType: above
    message: "Compositions are failing to reconcile — incident-agent will identify which and why."
  # Platform pods crash-looping (kubelet BackOff event, scoped to the platform namespace so a tenant
  # workload's crashloop never auto-triggers an RCA). threshold 3/15m ignores a single rollout blip.
  - name: krateo-platform-crashloop
    displayName: "Krateo — platform pod crash-looping"
    where: >-
      ResourceAttributes['k8s.namespace.name'] = '${NAMESPACE}'
      AND ResourceAttributes['telemetry.source'] = 'k8s-events'
      AND JSONExtractString(Body, 'object', 'reason') = 'BackOff'
      AND positionCaseInsensitive(JSONExtractString(Body, 'object', 'message'), 'restarting failed container') > 0
    interval: 15m
    threshold: 3
    thresholdType: above
    message: "A platform pod is crash-looping — incident-agent will triage the cause."
  # Platform image-pull failures (bad/private image pin, registry auth) in the platform namespace.
  - name: krateo-platform-image-pull-failure
    displayName: "Krateo — platform image pull failing"
    where: >-
      ResourceAttributes['k8s.namespace.name'] = '${NAMESPACE}'
      AND ResourceAttributes['telemetry.source'] = 'k8s-events'
      AND JSONExtractString(Body, 'object', 'reason') = 'Failed'
      AND positionCaseInsensitive(JSONExtractString(Body, 'object', 'message'), 'failed to pull image') > 0
    interval: 15m
    threshold: 2
    thresholdType: above
    message: "A platform pod cannot pull its image — incident-agent will triage the cause."
