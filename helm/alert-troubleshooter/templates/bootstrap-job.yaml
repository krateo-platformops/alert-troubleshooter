# hyperdx-key-bootstrap — provisions the HyperDX team API key into the `hyperdx-api-token`
# Secret headlessly (register/login → GET /api/team). The installer creates the admin-creds
# Secret (generated password) and applies this Job; re-runs are safe (idempotent via
# /api/installation). Uses the krateo-alert-troubleshooter SA (has secrets create/patch).
#
# The `hyperdx-admin-creds` Secret is NOT shipped here (never commit a password) — the
# installer generates it, e.g.:
#   kubectl create secret generic hyperdx-admin-creds -n krateo-system \
#     --from-literal=email=admin@krateo.local --from-literal=password="$(openssl rand -hex 24)"
#
# The name is VERSION-SUFFIXED on purpose. A Job's spec.template is IMMUTABLE, so when the image tag
# changes on a version bump the cdc's self-heal apply cannot patch a fixed-name Job
# ("spec.template: field is immutable") and the whole composition wedges Ready=False. Suffixing the
# name with the image tag makes each release a NEW Job (helm creates it and prunes the previous one),
# so there is never an in-place patch of an immutable field. Within a release the name is stable, so
# steady-state reconciles are a no-op. (A pre-upgrade Helm hook would also work but can't be used here:
# the Job runs as the krateo-alert-troubleshooter SA — a main-phase resource a pre-install hook would
# race on a fresh install.)
{{- $btag := .Values.image.tag | default .Chart.AppVersion | toString -}}
{{- $bver := $btag | lower | replace "." "-" | replace "+" "-" | replace "_" "-" | trunc 40 | trimSuffix "-" -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: hyperdx-key-bootstrap-{{ $bver }}
  namespace: krateo-system
spec:
  backoffLimit: 6            # HyperDX may still be booting when the installer fires this
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels: { app: hyperdx-key-bootstrap }
    spec:
      serviceAccountName: krateo-alert-troubleshooter
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: {{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}
          imagePullPolicy: Always
          command: ["python", "bootstrap.py"]
          env:
            - name: HYPERDX_URL
              value: http://krateo-clickstack.krateo-system.svc:3000
            - name: NAMESPACE
              value: krateo-system
            - name: SECRET_NAME
              value: hyperdx-api-token
            - name: HYPERDX_ADMIN_EMAIL
              valueFrom: { secretKeyRef: { name: hyperdx-admin-creds, key: email } }
            - name: HYPERDX_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: hyperdx-admin-creds, key: password } }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            seccompProfile: { type: RuntimeDefault }
            capabilities: { drop: ["ALL"] }
