{{- if .Values.config.authnUrl }}
# Intra-service auth (Option A). Maps this component's Kubernetes ServiceAccount
# (krateo-alert-troubleshooter) to a Krateo identity so authn's `serviceaccount` login strategy will
# exchange its projected token (audience "authn") for a Krateo JWT — which the handler presents on the
# A2A call so incident-agent can reach its agentgateway-gated MCP tools. The CR's existence is the
# allowlist; RBAC for the identity is standard Kubernetes bound to spec.groups (mirrors snowplow-seed).
#
# Rendered ONLY when config.authnUrl is set (i.e. intra-service auth is enabled). It requires the
# serviceaccount.authn.krateo.io CRD (authn's serviceaccount strategy) — do not enable authnUrl on a
# cluster without it.
apiVersion: serviceaccount.authn.krateo.io/v1alpha1
kind: ServiceAccount
metadata:
  name: krateo-alert-troubleshooter
  namespace: {{ .Release.Namespace }}
spec:
  displayName: alert troubleshooter RCA (intra-service auth)
  serviceAccountRef:
    name: krateo-alert-troubleshooter
    namespace: {{ .Release.Namespace }}
  groups:
    - krateo:alert-troubleshooter
{{- end }}
