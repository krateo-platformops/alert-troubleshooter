# krateo-alert-troubleshooter — the HyperDX-alert → RCA-analysis handler. HyperDX posts a
# fired alert to http://krateo-alert-troubleshooter.krateo-system.svc:8080/webhook; the handler
# calls the RCA agent's A2A endpoint (config.autopilotA2aUrl, incident-agent by default) and
# writes a TroubleshootingReport CR. Image is tag-driven (values.image.tag = chart appVersion),
# a real tag published (from main@a0bfebf) after the arm64 build fix — verified multi-arch
# (linux/amd64 + linux/arm64) with `docker buildx imagetools inspect`. Bump this version tag
# alongside any future handler.py/hyperdx*.py change that needs to reach the cluster.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: krateo-alert-troubleshooter
  namespace: krateo-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: krateo-alert-troubleshooter
  namespace: krateo-system
rules:
  - apiGroups: ["observability.krateo.io"]
    resources: ["troubleshootingreports", "troubleshootingreports/status"]
    verbs: ["create", "get", "list", "patch", "update"]
  # the reconciler reads Alert CRs (desired), seeds defaults, and writes their status
  - apiGroups: ["observability.krateo.io"]
    resources: ["alerts", "alerts/status"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  # the key-bootstrap Job (same SA) writes the hyperdx-api-token Secret
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: krateo-alert-troubleshooter
  namespace: krateo-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: krateo-alert-troubleshooter
subjects:
  - kind: ServiceAccount
    name: krateo-alert-troubleshooter
    namespace: krateo-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: krateo-alert-troubleshooter
  namespace: krateo-system
  labels: { app: krateo-alert-troubleshooter }
spec:
  replicas: 1
  selector:
    matchLabels: { app: krateo-alert-troubleshooter }
  template:
    metadata:
      labels: { app: krateo-alert-troubleshooter }
    spec:
      serviceAccountName: krateo-alert-troubleshooter
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: handler
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          ports:
            - containerPort: 8080
          env:
            # All runtime config is overridable via values.config.* (installer:
            # componentValues.alert-troubleshooter.config.*); defaults live in values.yaml and match the
            # in-cluster krateo-system layout. NAMESPACE is the release namespace (where reports are created).
            - name: NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: AUTOPILOT_A2A_URL
              value: {{ .Values.config.autopilotA2aUrl | quote }}
            - name: REPORT_COOLDOWN
              value: {{ .Values.config.reportCooldown | quote }}     # dedup window (s): don't re-analyze the same alert within this
            # --- reconciler (Alert CRs -> HyperDX v2 external API, Bearer auth) ---
            - name: HYPERDX_API_URL
              value: {{ .Values.config.hyperdxApiUrl | quote }}
            - name: HYPERDX_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: hyperdx-api-token, key: accessKey } }
            - name: RECONCILE_INTERVAL
              value: {{ .Values.config.reconcileInterval | quote }}
            # default Alert CRs seeded by the reconciler (not shipped as CRs — CRD-order safe)
            - name: DEFAULT_ALERTS_JSON
              value: {{ .Values.config.defaultAlerts | toJson | quote }}
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true          # KSV-0014
            seccompProfile: { type: RuntimeDefault }  # KSV-0104
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: tmp
              mountPath: /tmp                       # only writable path a read-only-root app needs
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: krateo-alert-troubleshooter
  namespace: krateo-system
spec:
  # Headless: this bench cluster's ClusterIP range is exhausted; a headless service still
  # resolves krateo-alert-troubleshooter.krateo-system.svc → the pod IP for HyperDX's webhook POST.
  clusterIP: None
  selector: { app: krateo-alert-troubleshooter }
  ports:
    - port: 8080
      targetPort: 8080
