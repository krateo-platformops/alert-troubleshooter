# krateo-alert-troubleshooter — the HyperDX-alert → RCA-analysis handler. HyperDX posts a
# fired alert to http://krateo-alert-troubleshooter.krateo-system.svc:8080/webhook; the handler
# calls the RCA agent's A2A endpoint (config.autopilotA2aUrl, incident-agent by default) and
# writes a TroubleshootingReport CR. Image is tag-driven (values.image.tag = chart appVersion),
# a real tag published (from main@a0bfebf) after the arm64 build fix — verified multi-arch
# (linux/amd64 + linux/arm64) with `docker buildx imagetools inspect`. Bump this version tag
# alongside any future handler.py/hyperdx*.py change that needs to reach the cluster.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: krateo-alert-troubleshooter
  namespace: krateo-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: krateo-alert-troubleshooter
  namespace: krateo-system
rules:
  - apiGroups: ["observability.krateo.io"]
    resources: ["troubleshootingreports", "troubleshootingreports/status"]
    verbs: ["create", "get", "list", "patch", "update"]
  # the reconciler reads Alert CRs (desired), seeds defaults, and writes their status
  - apiGroups: ["observability.krateo.io"]
    resources: ["alerts", "alerts/status"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  # the key-bootstrap Job (same SA) writes the hyperdx-api-token Secret
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: krateo-alert-troubleshooter
  namespace: krateo-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: krateo-alert-troubleshooter
subjects:
  - kind: ServiceAccount
    name: krateo-alert-troubleshooter
    namespace: krateo-system
---
# The observer (a thread in the handler image) correlates AuditRecords -> TroubleshootingReport
# remediation steps CLUSTER-WIDE: a remediation write can target any namespace and its AuditRecord
# lives next to the target object (observer.py AUDIT_NAMESPACE/REPORT_NAMESPACE default ""=all-ns), so
# it LISTs auditrecords + troubleshootingreports across all namespaces and PATCHes report status in the
# report's own namespace. A namespaced Role cannot authorize an all-namespaces list, so this needs a
# ClusterRole. It now also carries the cluster-wide READ the RCA itself needs (see the rules below).
# The namespaced Role above still covers the handler/reconciler's in-namespace writes (create reports,
# alerts, the hyperdx-token Secret).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: krateo-alert-troubleshooter-observer
rules:
  # CLUSTER-WIDE READ. The RCA is asked to explain arbitrary cluster failures, so it must be able to
  # READ arbitrary cluster objects. Without this it could read nothing but its own CRDs, and every
  # k8s tool call in an analysis came back Forbidden — on krateo-057 three separate reports recorded
  # it in status.missingContext ("User krateo-alert-troubleshooter cannot get/list ..."), and the
  # analysis silently fell back to ClickHouse logs alone while still publishing 0.95-0.98 confidence.
  # An RCA that never read a live object is indistinguishable from a grounded one unless you open
  # that field, which is the worst property a diagnostic can have.
  #
  # This is READ-ONLY and deliberate. It does NOT restore the old confused deputy: that was
  # `kagent-tools` bound to apiGroups/resources/verbs ALL — full WRITE as a shared, user-facing
  # identity. That binding was removed when tool calls moved to the caller's identity via the
  # agentgateway cert-replay hop, and nothing here brings it back. This grants get/list/watch to ONE
  # non-user-facing analyzer.
  #
  # It does include secrets cluster-wide, which is the honest cost of "read everything". The
  # mitigating control is on the LLM path, not here: the agentgateway promptGuard masks key material
  # and connection strings before anything reaches a model. Both subjects below are this one
  # non-user-facing analyzer, reached by its two paths (in-process SA, replayed cert).
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["*"]
    verbs: ["get"]
  # The wildcard above is read-only, so the report status WRITE still needs naming explicitly.
  - apiGroups: ["observability.krateo.io"]
    resources: ["troubleshootingreports", "troubleshootingreports/status"]
    verbs: ["patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: krateo-alert-troubleshooter-observer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: krateo-alert-troubleshooter-observer
subjects:
  # The in-process observer thread, which talks to the apiserver with the pod's own SA token.
  - kind: ServiceAccount
    name: krateo-alert-troubleshooter
    namespace: krateo-system
  # The RCA's k8s tool calls, which do NOT arrive as this ServiceAccount. incident-agent runs them
  # through the agentgateway cert-replay hop: it swaps the caller's authn JWT for the client cert in
  # <user>-clientconfig, so the apiserver sees that cert's CN as the User and its O= entries as Groups.
  # The cert carries O=krateo:alert-troubleshooter (serviceaccount-authn.yaml spec.groups), never
  # system:serviceaccount:..., so only a Group subject authorizes the read granted above.
  # Snowplow resolves an apiRef Alert's RESTAction as this same identity: the read above covers
  # `get restactions` and every read a RESTAction makes.
  - kind: Group
    name: krateo:alert-troubleshooter
    apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: krateo-alert-troubleshooter
  namespace: krateo-system
  labels: { app: krateo-alert-troubleshooter }
spec:
  replicas: 1
  selector:
    matchLabels: { app: krateo-alert-troubleshooter }
  template:
    metadata:
      labels: { app: krateo-alert-troubleshooter }
    spec:
      serviceAccountName: krateo-alert-troubleshooter
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      volumes:
        - name: tmp
          emptyDir: {}
        # Intra-service auth (Option A): an audience-bound projected SA token the handler exchanges at
        # authn for a service JWT. Harmless when config.authnUrl is unset (the handler never reads it).
        - name: authn-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: authn
                  expirationSeconds: 600
                  path: token
      containers:
        - name: handler
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          ports:
            - containerPort: 8080
          env:
            # All runtime config is overridable via values.config.* (installer:
            # componentValues.alert-troubleshooter.config.*); defaults live in values.yaml and match the
            # in-cluster krateo-system layout. NAMESPACE is the release namespace (where reports are created).
            - name: NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: AUTOPILOT_A2A_URL
              value: {{ .Values.config.autopilotA2aUrl | quote }}
            # Intra-service auth (Option A): when set, the handler exchanges the projected SA token
            # (audience "authn", mounted below) at <authnUrl>/serviceaccount/login for a Krateo JWT and
            # presents it on the A2A call so incident-agent can reach its agentgateway-gated MCP tools.
            # Empty (default) = unauthenticated A2A, exactly as before (older clusters with no gateway).
            - name: AUTHN_URL
              value: {{ .Values.config.authnUrl | quote }}
            # apiRef alerts: snowplow resolves the RESTAction under the service JWT above.
            - name: SNOWPLOW_URL
              value: {{ .Values.config.snowplowUrl | quote }}
            - name: REPORT_COOLDOWN
              value: {{ .Values.config.reportCooldown | quote }}     # dedup window (s): don't re-analyze the same alert within this
            # --- reconciler (Alert CRs -> HyperDX v2 external API, Bearer auth) ---
            - name: HYPERDX_API_URL
              value: {{ .Values.config.hyperdxApiUrl | quote }}
            - name: HYPERDX_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: hyperdx-api-token, key: accessKey } }
            - name: RECONCILE_INTERVAL
              value: {{ .Values.config.reconcileInterval | quote }}
            # default Alert CRs seeded by the reconciler (not shipped as CRs — CRD-order safe).
            # `${NAMESPACE}` in a default alert's SQL `where` is substituted with the release namespace
            # here, so the platform-scoped defaults are portable across a non-default krateo namespace.
            - name: DEFAULT_ALERTS_JSON
              value: {{ .Values.config.defaultAlerts | toJson | replace "${NAMESPACE}" .Release.Namespace | quote }}
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true          # KSV-0014
            seccompProfile: { type: RuntimeDefault }  # KSV-0104
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: tmp
              mountPath: /tmp                       # only writable path a read-only-root app needs
            - name: authn-token                     # projected SA token (aud "authn") for intra-service auth
              mountPath: /var/run/secrets/authn
              readOnly: true
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: krateo-alert-troubleshooter
  namespace: krateo-system
spec:
  # Headless: this bench cluster's ClusterIP range is exhausted; a headless service still
  # resolves krateo-alert-troubleshooter.krateo-system.svc → the pod IP for HyperDX's webhook POST.
  clusterIP: None
  selector: { app: krateo-alert-troubleshooter }
  ports:
    - port: 8080
      targetPort: 8080
