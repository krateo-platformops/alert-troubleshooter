# Alert (alerts.observability.krateo.io) — desired HyperDX alert, reconciled by the session-driven
# reconciler in krateo-alert-troubleshooter (KOG can't manage HyperDX v2.27's session-only API).
# spec = what to alert on; status mirrors the live HyperDX alert state.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: alerts.observability.krateo.io
spec:
  group: observability.krateo.io
  scope: Namespaced
  names:
    kind: Alert
    listKind: AlertList
    plural: alerts
    singular: alert
    categories: [krateo, observability]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: State
          type: string
          jsonPath: .status.state
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Interval
          type: string
          jsonPath: .spec.interval
        - name: Threshold
          type: number
          jsonPath: .spec.threshold
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [interval, threshold, thresholdType]
              x-kubernetes-validations:
                - rule: "has(self.where) != has(self.apiRef)"
                  message: set exactly one of where (a HyperDX row count) or apiRef (a RESTAction value)
              properties:
                displayName:
                  type: string
                  description: Alert name shown in HyperDX (defaults to metadata.name).
                where:
                  type: string
                  description: >
                    ClickHouse SQL boolean expression over the logs source counted by the alert
                    (empty = all rows). Exactly one of where / apiRef is set. The controller pins
                    whereLanguage:"sql" on the tile, and the
                    expression reaches the query's WHERE clause verbatim. Severity travels in the
                    text rather than in a severity column, so predicates read off Body and, for
                    Kubernetes events, the JSON inside it — e.g.
                    ResourceAttributes['telemetry.source'] = 'k8s-events' AND
                    JSONExtractString(Body, 'object', 'reason') = 'BackOff'.
                apiRef:
                  type: object
                  required: [name, namespace]
                  description: >
                    A RESTAction (templates.krateo.io/v1) to alert on, the same reference widgets
                    use. Snowplow resolves it as the troubleshooter's authn identity, and its filter
                    must return {value: N, items?: [...]}: value is compared with threshold, and
                    items (the objects that matched) go into the RCA prompt. HyperDX is not
                    involved. Exactly one of where / apiRef is set.
                  properties:
                    name:
                      type: string
                    namespace:
                      type: string
                interval:
                  type: string
                  enum: ["1m", "5m", "15m", "30m", "1h", "6h", "12h", "1d"]
                  default: "5m"
                  description: >
                    For a where alert, the window rows are counted over. For an apiRef alert, how
                    often the RESTAction is evaluated.
                threshold:
                  type: number
                  description: >
                    Trigger value compared via thresholdType. For a where alert the value compared
                    is a COUNT of rows over the window, so it is never negative — which makes some
                    pairings decided before any data is read and rejected by the controller with
                    phase: Invalid: 'above 0' (value >= 0) fires on every evaluation including an
                    empty result, and 'below 0' (value < 0) can never fire at all. Use 1 with
                    'above' for "at least one", and 1 with 'below' for "none in this window". For
                    an apiRef alert the value is the RESTAction's value, which may be any number.
                thresholdType:
                  type: string
                  enum: [above, below, above_exclusive, below_or_equal, equal, not_equal, between, not_between]
                  default: above
                  description: >
                    How value is compared with threshold: above >=, above_exclusive >, below <,
                    below_or_equal <=, equal ==, not_equal !=. between / not_between need a
                    thresholdMax, which an Alert has no field for.
                message:
                  type: string
                  description: Notification message (markdown).
            status:
              type: object
              properties:
                hyperdxAlertId:
                  type: string
                hyperdxDashboardId:
                  type: string
                state:
                  type: string
                  description: Live HyperDX alert state (OK / ALERT / PENDING).
                okSince:
                  type: string
                  format: date-time
                  nullable: true
                  description: >
                    When the alert last turned OK; unset while state is anything but OK. Written
                    by the loop that writes state, for display only: it never closes an incident.
                value:
                  type: number
                  nullable: true
                  description: >
                    The number an apiRef alert's RESTAction returned at its last evaluation, the
                    one compared with threshold; unset for a where alert. For display only.
                phase:
                  type: string
                  description: >
                    Reconcile phase. Pending (no HyperDX alert yet) / Invalid (the threshold can only
                    have one outcome — see threshold) / Synced (the CR's spec IS the
                    live alert) / SpecDrift (the spec could not be pushed — the live alert does
                    NOT match this CR) / Error.
                error:
                  type: string
                lastSyncedAt:
                  type: string
                  format: date-time
